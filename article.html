<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
</head>

<body class="font-[Inter]">
    <main class="max-w-5xl mx-auto px-4">
        <h1 class="text-2xl md:text-4xl font-extrabold text-center mt-10 mb-2 w-5/8 mx-auto">
            Article about gender pay gap problem
        </h1>

        <p class="text-center text-gray-600 text-xs w-2/6 mx-auto mb-8">
            Description
        </p>

        <img src="./assets/images/gender_pay_gap.png" 
            class="w-11/12 md:w-2/3 lg:w-1/2 mx-auto max-h-[350px] max-w-2xl object-contain "/>

        <section class="w-5/9 mx-auto mt-16">

            <h2 class="text-sm font-bold mb-2">
                First subheader
            </h2>

            <p class="text-gray-700 leading-8 mb-10 text-xs">
                Blabla bla
            </p>

            <h2 class="text-sm font-bold mb-2">
                Another subheader to break up text
            </h2>

            <p class="text-gray-700 leading-8 mb-10 text-xs">
                Bla bla bla
            </p>

        </section>

        <!-- Citation -->
        <section class="mt-20 text-center max-w-xl mx-auto">
            <p class="text-xl md:text-2xl font-semibold mb-6">
                “Citation of someone”
            </p>
            <div class="flex items-center justify-center">
                <img src="./assets/images/person1.png"
                    class="w-14 h-14 rounded-lg object-cover mb-3 mr-4"/>
                <div class="text-left">
                    <p class="text-sm font-bold mb-1"> Full name </p>
                    <p class="text-xs text-gray-500"> Role at company </p>
                </div>
            </div>
        </section>

        <section class="w-5/9 mx-auto mt-16">

            <h2 class="text-sm font-bold mb-2">
                Last subheader, for good measure
            </h2>

            <p class="text-gray-700 leading-8 mb-10 text-xs">
                Final bla blabla
            </p>

        </section>
    </main>
</body>
</html>
